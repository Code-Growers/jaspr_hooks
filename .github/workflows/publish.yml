name: Publish to pub.dev

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  browser-e2e:
    uses: ./.github/workflows/e2e.yml

  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart run tool/release_preflight.dart --require-published

  publish:
    needs: [preflight, quality, browser-e2e]
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
