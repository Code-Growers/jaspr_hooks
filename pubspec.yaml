name: jaspr_hooks
description: React-style lifecycle and state hooks for native Jaspr components.
version: 0.3.0-beta.1
repository: https://github.com/Code-Growers/jaspr_hooks
issue_tracker: https://github.com/Code-Growers/jaspr_hooks/issues
documentation: https://code-growers.github.io/jaspr_hooks/

topics:
  - jaspr
  - hooks
  - web
  - state-management
  - server-side-rendering

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  # Jaspr's beta permits older http releases that lack its retry.dart import.
  http: '>=0.13.2 <2.0.0'
  jaspr: '>=0.24.0-beta.0 <0.25.0'
  universal_web: ^1.1.1+1
  web: ^1.1.1

dev_dependencies:
  jaspr_lints: ^0.8.0-beta.0
  jaspr_test: 0.24.0-beta.0
  lints: ^6.1.0
  test: ^1.25.8
