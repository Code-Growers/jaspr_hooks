name: jaspr_hooks_example
description: Interactive documentation and examples for jaspr_hooks.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  jaspr: 0.24.0-beta.0
  jaspr_content: 0.6.0-beta.0
  jaspr_hooks:
    path: ..
  universal_web: ^1.1.1+1
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.7.0
  build_web_compilers: ^4.8.5
  jaspr_builder: 0.24.0-beta.0
  jaspr_cli: 0.24.0-beta.0
  jaspr_lints: ^0.8.0-beta.0
  jaspr_test: 0.24.0-beta.0
  lints: ^6.1.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  test: ^1.25.8

jaspr:
  mode: static
